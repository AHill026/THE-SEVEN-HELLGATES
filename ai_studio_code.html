    :root {
      --gold: #d4af37;
      --ember: #ff4500;
      --abyss: #040206;
      --azure: #68b8ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: 'Cinzel', serif;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    /* Cinematic Widescreen Letterbox (2.39:1 scope vibe) */
    .letterbox {
      position: absolute;
      left: 0;
      width: 100%;
      height: 7vh;
      background: #000;
      z-index: 20;
      pointer-events: none;
      transition: height 0.6s ease;
    }
    .letterbox-top { top: 0; border-bottom: 1px solid rgba(255, 69, 0, 0.15); }
    .letterbox-bottom { bottom: 0; border-top: 1px solid rgba(255, 69, 0, 0.15); }

    /* Vignette & Atmospheric Film Grain Overlay */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background: radial-gradient(circle at center, transparent 40%, rgba(2, 1, 4, 0.82) 85%, #000 100%);
      box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
    }

    /* Screen Flash FX */
    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      opacity: 0;
      z-index: 25;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }

    /* Subtitles and Narrative Dialogue */
    #subtitle-container {
      position: absolute;
      bottom: 9vh;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 900px;
      text-align: center;
      z-index: 30;
      pointer-events: none;
    }

    .subtitle-text {
      font-size: clamp(14px, 2.8vw, 22px);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
      color: #eae5d9;
      text-shadow: 0 0 12px rgba(0,0,0,0.95), 0 0 20px rgba(255, 69, 0, 0.5);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .subtitle-text.active {
      opacity: 1;
      transform: translateY(0);
    }

    .whisper-accent {
      color: #9fe2ff !important;
      font-style: italic;
      letter-spacing: 0.35em !important;
      text-shadow: 0 0 15px rgba(104, 184, 255, 0.9), 0 0 35px #3a7bd5 !important;
    }

    /* Cinematic Chapter / Act Stamp */
    #chapter-badge {

      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(10px, 1.8vw, 13px);
      letter-spacing: 0.4em;
      color: rgba(212, 175, 55, 0.85);
      text-transform: uppercase;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1s ease;
      text-shadow: 0 0 8px rgba(0,0,0,0.9);
    }

      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.96);

      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 2.2s cubic-bezier(0.2, 0, 0, 1);
      padding: 24px;
      text-align: center;
    }

    #final-title-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }
